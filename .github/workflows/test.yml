name: Run Login Test + Allure + n8n

on:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Dependencies
    run: |
      pip install pytest pytest-json-report pandas allure-pytest

  - name: Run Test
    run: |
      pytest --json-report --json-report-file=report.json || true
```
