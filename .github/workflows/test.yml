name: Run Login Test + Allure + n8n

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pytest pytest-json-report pandas allure-pytest

      - name: Run Login Test
        run: pytest tests/test_login.py --disable-warnings -v --json-report --json-report-file=report.json --alluredir=allure-results || true

      - name: Send Results to n8n
        if: always()
        run: curl -X POST https://rohits45.app.n8n.cloud/webhook/test-results -H "Content-Type: application/json" -d @report.json
